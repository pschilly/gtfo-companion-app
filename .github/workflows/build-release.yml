name: Build Portable GTFO Companion App Executable

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows-portable:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Create .env from GitHub Secrets
        shell: bash
        env:
          DISCORD_CLIENT_ID: ${{ secrets.VITE_DISCORD_CLIENT_ID }}
          DISCORD_GUILD_ID: ${{ secrets.VITE_DISCORD_GUILD_ID }}
          COMMUNITY_ROLE_ID: ${{ secrets.VITE_DISCORD_COMMUNITY_ROLE_ID }}
          CORE_ROLE_ID: ${{ secrets.VITE_DISCORD_CORE_ROLE_ID }}
          PORTAL_BASE_URL: ${{ secrets.VITE_PORTAL_BASE_URL }}
          MANIFEST_URL: ${{ secrets.VITE_MANIFEST_URL }}
          KB_URL: ${{ secrets.VITE_KB_URL }}
          CDN_LOGO_URL: ${{ secrets.VITE_CDN_LOGO_URL }}
        run: |
          cat << EOF > .env
          VITE_DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
          VITE_DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
          VITE_DISCORD_COMMUNITY_ROLE_ID=${COMMUNITY_ROLE_ID}
          VITE_DISCORD_CORE_ROLE_ID=${CORE_ROLE_ID}
          VITE_OAUTH_REDIRECT_PORT=54321
          VITE_PORTAL_BASE_URL=${PORTAL_BASE_URL:-https://members.globaltaskforceoverlord.org/api/v1/companion}
          VITE_MANIFEST_URL=${MANIFEST_URL:-https://members.globaltaskforceoverlord.org/api/v1/companion/manifest}
          VITE_KB_URL=${KB_URL:-https://kb.globaltaskforceoverlord.org}
          VITE_CDN_LOGO_URL=${CDN_LOGO_URL:-https://cdn.globaltaskforceoverlord.org/GTFO-Logo.png}
          EOF

      - name: Build Tauri Windows Executable
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          VITE_DISCORD_CLIENT_ID: ${{ secrets.VITE_DISCORD_CLIENT_ID }}
          VITE_DISCORD_GUILD_ID: ${{ secrets.VITE_DISCORD_GUILD_ID }}
          VITE_DISCORD_COMMUNITY_ROLE_ID: ${{ secrets.VITE_DISCORD_COMMUNITY_ROLE_ID }}
          VITE_DISCORD_CORE_ROLE_ID: ${{ secrets.VITE_DISCORD_CORE_ROLE_ID }}

      - name: Upload Portable Executable Artifact (.exe)
        uses: actions/upload-artifact@v5
        with:
          name: GTFO-Companion-App-Portable-Exe
          path: src-tauri/target/release/gtfo-companion-app.exe

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.zip
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/latest.json
            src-tauri/target/release/gtfo-companion-app.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
